# Room-scenario "extended_waiting_rooms" — EXPLORATORY, not the default.
#
# Same physical rooms as config/rooms.yaml, but Rooms 3013 and 3033 are ALSO
# converted to interviewer waiting rooms, alongside the existing 2018. That
# drops the interview-room pool to:
#   Thursday: 2016, 2017, 2020, 2019            -> 4 rooms (was 5)
#   Friday:   2014, 2015, 2019                  -> 3 rooms (was 4)
#
# Select this scenario with `--room-scenario extended_waiting_rooms` (CLI) or
# `room_scenario: "extended_waiting_rooms"` (API `POST /solve` body) instead
# of hand-editing config/rooms.yaml — see settings.py `resolve_room_scenario_dir`.
#
# `max_concurrent_panels` is left at 5 (config/rooms.yaml's value), NOT
# raised, on every room here. It was measured, not assumed: solving the real
# ~108-applicant dataset (`data/workspaces/Test Run 1`, 216 interviews)
# against this scenario placed all 216 interviews with zero clashes and hit
# 5 panels in one room on one evening (2019, Friday) — the ceiling was
# touched but never needed to go higher. Raising it was the fallback plan if
# that measurement had come back short; it didn't, so ROOM_CONCURRENCY_CEILING
# in settings.py is untouched too. See
# docs/room_scenario_extended_waiting_rooms.md for the full verification run
# and the numbers behind this.
rooms:
  # ---- Thursday 2026-09-17 ----
  - id: "2016"
    max_concurrent_panels: 5
    divisions: [MEDMARDOC, CREATIVE, LOGISTICS, LIAISON, FNB, PROGRAM]
    days: [2026-09-17]
  - id: "2017"
    max_concurrent_panels: 5
    divisions: [MEDMARDOC, CREATIVE, LOGISTICS, LIAISON, FNB, PROGRAM]
    days: [2026-09-17]
  - id: "2020"
    max_concurrent_panels: 5
    divisions: [MEDMARDOC, CREATIVE, LOGISTICS, LIAISON, FNB, PROGRAM]
    days: [2026-09-17]
  # ---- Friday 2026-09-18 ----
  - id: "2014"
    max_concurrent_panels: 5
    divisions: [MEDMARDOC, CREATIVE, LOGISTICS, LIAISON, FNB, PROGRAM]
    days: [2026-09-18]
  - id: "2015"
    max_concurrent_panels: 5
    divisions: [MEDMARDOC, CREATIVE, LOGISTICS, LIAISON, FNB, PROGRAM]
    days: [2026-09-18]
  # ---- Both evenings ----
  - id: "2019"
    max_concurrent_panels: 5
    divisions: [MEDMARDOC, CREATIVE, LOGISTICS, LIAISON, FNB, PROGRAM]
    days: [2026-09-17, 2026-09-18]

  # ---- Waiting rooms (permanent — not part of the interview pool) ----
  # 2018 matches config/rooms.yaml. 3013 and 3033 are the two rooms THIS
  # scenario additionally withdraws from the interview pool. Same mechanism
  # as 2018 (`interview_room: false`, `divisions: []`): kept out of
  # `_pick_panel_room` / `rebalance_panels` / `autoscale_panels` / CP-SAT
  # entirely, but still rendered as a venue landmark in exports.
  - id: "2018"
    label: "Waiting Room"
    interview_room: false
    max_concurrent_panels: 1
    divisions: []
    days: [2026-09-17, 2026-09-18]
  - id: "3013"
    label: "Waiting Room"
    interview_room: false
    max_concurrent_panels: 1
    divisions: []
    days: [2026-09-17, 2026-09-18]
  - id: "3033"
    label: "Waiting Room"
    interview_room: false
    max_concurrent_panels: 1
    divisions: []
    days: [2026-09-17, 2026-09-18]
