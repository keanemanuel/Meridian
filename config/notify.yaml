# Sender identity and template map for the notify stage (FR-60..FR-67).
# Values below are placeholders — fill in before running `iffsched notify`.
# See docs/SPEC.md §10 for how sending method and quotas are chosen.

sender_name: ""             # e.g. "IFF Recruitment Committee"
sender_email: ""             # e.g. "recruitment@iff.example"
reply_to: ""                  # e.g. "recruitment@iff.example"
throttle_seconds: 1.0         # pause between sends, to respect provider quotas

templates:
