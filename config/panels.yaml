# Baseline staffing: one panel per division per event day (SPEC.md §1.2 —
# "12 panels is the baseline", "one room per division"). 12 panels total.
#
# This is the *starting* point, not the final plan. Before every solve the
# load-balancer (`rebalance_panels`, SPEC.md §5.5) grows a division that is
# running hot one panel at a time, each new panel in a DIFFERENT room that
# day — filling the rooms available that evening room by room. Two panels of
# the SAME division never share a room on the same day; different divisions
# freely share a room (bounded by the room's `max_concurrent_panels`, FR-24).
# `autoscale_panels` is the INFEASIBLE backstop on top of that.
#
# Rooms per evening (config/rooms.yaml): Thursday 6 (2016, 2017, 2020, 3013,
# 2018, 2019), Friday 5 (2014, 2015, 3033, 2018, 2019). A division can grow
# to one panel in every room that evening before the rare same-room fallback
# is ever considered.
#
# Panels in a room that only runs one evening inherit that day automatically;
# panels in 2018 / 2019 (both evenings) pin their day with `active_windows`.
panels:
  # ---------------- Thursday 2026-09-17 — one per division ----------------
  - {id: PROGRAM-T,   division: PROGRAM,   room: "2016"}
  - {id: MEDMARDOC-T, division: MEDMARDOC, room: "2017"}
  - {id: FNB-T,       division: FNB,       room: "2020"}
  - {id: LOGISTICS-T, division: LOGISTICS, room: "3013"}
  - id: CREATIVE-T
    division: CREATIVE
    room: "2018"
    active_windows: [{date: 2026-09-17, start: "18:00", end: "21:30"}]
  - id: LIAISON-T
    division: LIAISON
    room: "2019"
    active_windows: [{date: 2026-09-17, start: "18:00", end: "21:30"}]

  # ----------------- Friday 2026-09-18 — one per division -----------------
  - {id: PROGRAM-F,   division: PROGRAM,   room: "2014"}
  - {id: MEDMARDOC-F, division: MEDMARDOC, room: "2015"}
  - {id: FNB-F,       division: FNB,       room: "3033"}
  - id: LOGISTICS-F
    division: LOGISTICS
    room: "2018"
    active_windows: [{date: 2026-09-18, start: "17:00", end: "21:30"}]
  - id: CREATIVE-F
    division: CREATIVE
    room: "2019"
    active_windows: [{date: 2026-09-18, start: "17:00", end: "21:30"}]
  - id: LIAISON-F
    division: LIAISON
    room: "2014"
